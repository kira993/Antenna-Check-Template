<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antenna Check Template</title>
<style>
/* Layout: top-down plan, antennas two per row inside editable locations (set in settings). Tap a unit to set its status. */
:root {
  --bg: #edf0f3;
  --surface: #ffffff;
  --ink: #15202b;
  --muted: #566878;
  --line: #c6d0da;
  --accent: #1f5fd1;
  --ok: #17794a;
  --warn: #a96a0a;
  --down: #bf3326;
  --none: #7d8a97;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a; --surface: #172029; --ink: #e5ecf2; --muted: #92a3b3; --line: #2a3745;
    --accent: #78aaff; --ok: #3fb97a; --warn: #e3a53b; --down: #ff6f62; --none: #6b7b8a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #172029; --ink: #e5ecf2; --muted: #92a3b3; --line: #2a3745;
  --accent: #78aaff; --ok: #3fb97a; --warn: #e3a53b; --down: #ff6f62; --none: #6b7b8a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
}
.wrap { max-width: 460px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 28px; }
.wrap.sheet-open { padding-bottom: 440px; }

header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.titles { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.gear { appearance: none; flex: none; width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; }
.gear:hover { border-color: var(--accent); }
.gear:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.gear svg { width: 22px; height: 22px; display: block; }
.empty { grid-column: 1 / -1; margin: 0; padding: 24px 0; text-align: center; color: var(--muted); font-size: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin: 0; }

.counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.count { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 6px; text-align: center; min-width: 0; }
.count b { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 20px; font-variant-numeric: tabular-nums; color: var(--c); }
.count span { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.plan { position: relative; padding: 14px 0 34px; }
.helipad-row { display: flex; justify-content: center; margin: 46px 86px 84px 0; }
.helipad { width: 46px; height: 46px; display: grid; place-items: center; border: 2px solid var(--muted); border-radius: 50%; font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1; color: var(--muted); }
.hull { position: absolute; left: 0; top: 0; width: calc(100% - 86px); height: 100%; overflow: visible; pointer-events: none; }
.hull path { fill: var(--surface); stroke: var(--line); stroke-width: 2; stroke-linejoin: round; }
.zone-block { display: grid; grid-template-columns: minmax(0, 1fr) 80px; column-gap: 6px; align-items: center; }
.zone-grid { grid-column: 1; width: 100%; max-width: 210px; margin-inline: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.zone-grid .unit { padding: 4px; gap: 4px; }
.zone-grid .name { font-size: 18px; }
.zone-grid .name small { font-size: 9.5px; }
.zone-grid .pill { font-size: 10px; letter-spacing: 0.03em; }
.grid { position: relative; display: flex; flex-direction: column; }
.section { grid-column: 2; align-self: stretch; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; border-left: 2px solid var(--line); padding-left: 8px; }
.zone-block + .zone-block { margin-top: 40px; }
.zone-block.bow + .zone-block { margin-top: 76px; }
.stern-gap { height: 120px; }
.section .zone { font-family: var(--font-mono); font-size: 13px; font-weight: 500; letter-spacing: 0.14em; color: var(--accent); }
.section .area { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.1; letter-spacing: 0.02em; overflow-wrap: anywhere; }

.unit {
  --st: var(--none);
  appearance: none;
  position: relative;
  aspect-ratio: 1 / 1;
  width: 100%;
  min-width: 0;
  border: 2px solid var(--st);
  background: color-mix(in srgb, var(--st) 9%, var(--surface));
  color: var(--ink);
  border-radius: 8px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font: inherit;
  cursor: pointer;
  text-align: center;
}
.unit.round { border-radius: 28%; }
.unit::before { /* dish face */
  content: "";
  position: absolute;
  inset: 14%;
  border: 1px solid color-mix(in srgb, var(--st) 40%, transparent);
  border-radius: 4px;
  pointer-events: none;
}
.unit.round::before { border-radius: 22%; }
.unit:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.unit[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
.s-ok { --st: var(--ok); }
.s-issue { --st: var(--warn); }
.s-down { --st: var(--down); }
.name { position: relative; font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1; letter-spacing: 0.02em; max-width: 100%; overflow-wrap: anywhere; }
.name small { display: block; font-family: var(--font-mono); font-weight: 400; font-size: 10px; letter-spacing: 0.04em; color: var(--muted); margin-top: 3px; }
.pill { position: relative; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--st); font-weight: 500; }
.note-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--st); }
.unit.round .note-dot { top: 15%; right: 15%; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { appearance: none; font: inherit; font-size: 14px; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 9px 14px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.stamp { margin: 10px 0 0; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--surface);
  border-top: 1px solid var(--line);
  box-shadow: 0 -8px 24px rgba(0,0,0,0.12);
  max-height: 78vh;
  overflow-y: auto;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
}
.sheet-in { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.sheet-top { display: flex; align-items: center; gap: 8px; }
.sheet-top input { flex: 1; min-width: 0; font: inherit; font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: 0.02em; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 2px 0; }
.sheet-top input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { appearance: none; font: inherit; font-size: 13px; font-weight: 500; padding: 9px 4px; border-radius: 6px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; min-width: 0; }
.seg button[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--surface)); color: var(--c); font-weight: 600; }
.seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sheet textarea { font: inherit; font-size: 14px; width: 100%; min-height: 56px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--bg); color: var(--ink); }
.sheet textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.close { appearance: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; font: inherit; font-size: 13px; padding: 6px 10px; cursor: pointer; }
.meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 20; }
[hidden] { display: none !important; }

.photo-badge { position: absolute; top: 8px; left: 8px; display: flex; align-items: center; gap: 3px; font-family: var(--font-mono); font-size: 11px; color: var(--st); }
.unit.round .photo-badge { top: 12%; left: 12%; }
.photo-badge svg { width: 13px; height: 13px; display: block; }

.photos { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb { appearance: none; width: 56px; height: 56px; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); cursor: pointer; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.add { padding: 7px 12px; font-size: 13px; }

.lightbox { position: fixed; inset: 0; z-index: 10; background: #05090d; color: #e5ecf2; display: flex; flex-direction: column; }
.lb-bar, .lb-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; font-family: var(--font-mono); font-size: 12px; }
.lb-bar { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
.lb-nav { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.lb-actions { display: flex; gap: 8px; }
.lb-bar button, .lb-nav button { font: inherit; font-size: 13px; color: #e5ecf2; background: #1b2630; border: 1px solid #33424f; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
.lb-bar button:focus-visible, .lb-nav button:focus-visible { outline: 3px solid #78aaff; outline-offset: 2px; }
.lb-hint { color: #92a3b3; }
.lb-stage { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: center; justify-content: center; }
.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; cursor: zoom-in; }
.lb-stage.zoomed { display: block; }
.lb-stage.zoomed img { max-width: none; max-height: none; width: 250%; height: auto; cursor: zoom-out; }

.settings { position: fixed; inset: 0; z-index: 12; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
.st-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
.st-bar h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: 0.01em; }
.st-body { flex: 1; min-height: 0; overflow-y: auto; width: 100%; max-width: 460px; margin: 0 auto; padding: 14px 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
.st-help { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
.st-sec { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px; margin-bottom: 14px; }
.st-sec-head, .st-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.st-input { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; min-width: 0; height: 34px; }
.st-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.st-input.zone { width: 76px; font-family: var(--font-mono); letter-spacing: 0.06em; }
.st-input.area { flex: 1 1 120px; font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.st-row .st-input.name { flex: 1 1 90px; }
.mini { appearance: none; font: inherit; font-size: 14px; min-width: 34px; height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); cursor: pointer; }
.mini:disabled { opacity: 0.35; cursor: default; }
.mini:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mini.armed { border-color: var(--down); color: var(--down); font-weight: 600; }
.st-note { margin: 0; font-size: 12px; color: var(--muted); }
.st-add { display: flex; align-items: center; gap: 6px; border-top: 1px dashed var(--line); padding-top: 10px; }
.st-add .st-input { flex: 1; }

#report { display: none; }
@media print {
  @page { size: A4; margin: 14mm; }
  html, body { background: #fff !important; color: #14202b !important; }
  .wrap, .sheet, .toast, .lightbox, .settings { display: none !important; }
  #report { display: block; font-family: var(--font-body); font-size: 10.5pt; line-height: 1.4; color: #14202b; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #report h1 { font-family: var(--font-display); font-weight: 700; font-size: 26pt; line-height: 1.05; margin: 0; letter-spacing: 0.01em; }
  #report h2 { font-family: var(--font-display); font-weight: 700; font-size: 20pt; margin: 0 0 8pt; }
  .r-head { border-bottom: 2pt solid #14202b; padding-bottom: 6pt; margin-bottom: 10pt; }
  .r-date { margin: 4pt 0 0; font-size: 10pt; color: #566878; }
  .r-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6pt; margin-bottom: 12pt; }
  .r-count { border: 0.75pt solid #c6d0da; border-radius: 4pt; padding: 6pt; text-align: center; }
  .r-count b { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 18pt; }
  .r-count span { font-size: 8pt; letter-spacing: 0.06em; text-transform: uppercase; color: #566878; }
  .r-plan { display: grid; grid-template-columns: repeat(2, 42mm); gap: 6pt 10pt; justify-content: start; margin-bottom: 14pt; break-inside: avoid; }
  .r-sec { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 8pt; border-bottom: 0.75pt solid #c6d0da; padding-bottom: 3pt; }
  .r-sec:not(:first-child) { margin-top: 8pt; }
  .r-zone { font-family: var(--font-mono); font-weight: 500; font-size: 9pt; letter-spacing: 0.14em; color: #1f5fd1; }
  .r-area { font-family: var(--font-display); font-weight: 600; font-size: 13pt; }
  .r-tile { border: 1.5pt solid #6b7885; border-radius: 3pt; height: 13mm; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 8pt; text-transform: uppercase; letter-spacing: 0.05em; }
  .r-tile.round { border-radius: 9pt; }
  .r-tile b { font-family: var(--font-display); font-weight: 600; font-size: 12pt; letter-spacing: 0.02em; text-transform: none; color: #14202b; }
  .r-table { width: 100%; border-collapse: collapse; font-size: 9pt; }
  .r-table th { text-align: left; border-bottom: 1.5pt solid #14202b; padding: 4pt 5pt; font-size: 8pt; letter-spacing: 0.06em; text-transform: uppercase; color: #566878; }
  .r-table td { border-bottom: 0.5pt solid #c6d0da; padding: 4pt 5pt; vertical-align: top; }
  .r-table tr { break-inside: avoid; }
  .r-strong { font-weight: 600; }
  .r-note { white-space: pre-wrap; overflow-wrap: anywhere; }
  .r-photos { break-before: page; }
  .r-block { margin-bottom: 14pt; }
  .r-block h3 { font-family: var(--font-display); font-weight: 600; font-size: 13pt; margin: 0; break-after: avoid; }
  .r-meta { margin: 2pt 0 6pt; font-size: 9.5pt; color: #566878; white-space: pre-wrap; overflow-wrap: anywhere; break-after: avoid; }
  .r-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8pt; }
  .r-grid figure { margin: 0; break-inside: avoid; }
  .r-grid img { display: block; width: 100%; max-height: 95mm; object-fit: contain; background: #f1f4f7; border: 0.5pt solid #c6d0da; }
  .r-grid figcaption { margin-top: 2pt; font-family: var(--font-mono); font-size: 8pt; color: #566878; }
}

@media (prefers-reduced-motion: no-preference) { .unit { transition: background 0.15s, border-color 0.15s; } }
</style>

</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div class="titles">
      <h1>Antenna Check Template</h1>
      <p class="sub">Top view, bow at the top. Tap an antenna to set its status and add a note.</p>
    </div>
    <button class="gear" id="gearBtn" type="button" aria-label="Layout settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div class="counts" id="counts"></div>

  <div class="plan" id="plan">
    <svg class="hull" id="hull" aria-hidden="true"><path id="hullPath" d=""/></svg>
    <div class="grid" id="grid"></div>
  </div>

  <div class="actions">
    <button class="btn primary" id="pdf" type="button">Generate PDF report</button>
    <button class="btn" id="reset" type="button">Reset all</button>
  </div>
  <p class="stamp" id="stamp"></p>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div class="sheet-top">
      <input id="nameInput" type="text" maxlength="24" aria-label="Antenna name">
      <button class="close" id="closeBtn" type="button">Done</button>
    </div>
    <div class="seg" id="seg"></div>
    <textarea id="noteInput" placeholder="Note (e.g. no lock, high obstruction, cable damage)" aria-label="Note"></textarea>
    <div class="photos">
      <div class="thumbs" id="thumbs"></div>
      <button class="btn add" id="addPhoto" type="button">Add photo</button>
      <input id="photoInput" type="file" accept="image/*" multiple hidden>
    </div>
    <p class="meta" id="photoHint" hidden>This browser can't store photos, so they will be lost when you close the page.</p>
    <p class="meta" id="meta"></p>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<div class="settings" id="settings" hidden>
  <div class="st-bar">
    <h2>Layout settings</h2>
    <button class="close" id="settingsClose" type="button">Done</button>
  </div>
  <div class="st-body" id="stBody"></div>
</div>

<div id="report" aria-hidden="true"></div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-bar">
    <span id="lbCount"></span>
    <span class="lb-actions">
      <button type="button" id="lbDelete">Delete</button>
      <button type="button" id="lbClose">Close</button>
    </span>
  </div>
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt="Antenna photo"></div>
  <div class="lb-nav">
    <button type="button" id="lbPrev">Previous</button>
    <span class="lb-hint">Tap photo to zoom</span>
    <button type="button" id="lbNext">Next</button>
  </div>
</div>

<script>
(function () {
  var KEY = 'antenna-check-template-v2';
  var STATUSES = [
    { id: 'none', label: 'Unchecked', cls: '', color: 'var(--none)' },
    { id: 'ok', label: 'OK', cls: 's-ok', color: 'var(--ok)' },
    { id: 'issue', label: 'Issue', cls: 's-issue', color: 'var(--warn)' },
    { id: 'down', label: 'Down', cls: 's-down', color: 'var(--down)' }
  ];
  var LAYOUT_KEY = 'antenna-check-layout-v2';
  var TYPES = [
    { name: 'Starlink', prefix: 'SL', round: false },
    { name: 'Kymeta OneWeb', prefix: 'KY', round: true },
    { name: 'Other', prefix: 'ANT', round: false }
  ];
  function typeInfo(name) { return TYPES.filter(function (t) { return t.name === name; })[0] || TYPES[2]; }

  // Default layout, bow at the top: locations run FWD, MID, AFT. Antennas read row by row, two per row.
  function defaultLayout() {
    return [
      { zone: 'FWD', area: 'Solarium', items: [
        { id: 'kym2', label: 'KY-2', type: 'Kymeta OneWeb' },
        { id: 'sl8', label: 'SL-8', type: 'Starlink' }
      ] },

  // Draws the hull outline around the plan: pointed bow at the top around the first location, flat stern at the bottom.
  function drawHull() {
    var hs = hullEl.getBoundingClientRect();
    var W = hs.width, H = hs.height;
    if (!W || !H) return;
    var cx = W / 2, m = 3, hw = W / 2 - m;
    var yTop = 190, yFull = 312, hwT = Math.min(hw - 6, 105);
    var fg = grid.querySelector('.zone-grid');
    var ft = grid.querySelector('.unit');
    if (fg && ft) {
      var gr = fg.getBoundingClientRect(), tr = ft.getBoundingClientRect();
      yTop = tr.top - hs.top;
      yFull = tr.bottom - hs.top + 22;
      hwT = Math.min(hw - 6, gr.width / 2);
    }
    yFull = Math.min(Math.max(yFull, yTop + 40), H - 30);
    // Pointed bow: half-width w(y) = hw * (1 - (1 - y / yFull)^p), full width at yFull.
    // p is chosen so the hull clears the first row of antennas by 14px.
    var need = Math.min(hw - 1, hwT + 14) / hw;
    var p = Math.log(1 - need) / Math.log(1 - Math.min(yTop / yFull, 0.97));
    p = Math.max(1.3, Math.min(3, p));
    var right = [], left = [], n = 36, i;
    for (i = 0; i <= n; i++) {
      var u = i / n;
      var y = m + (yFull - m) * u;
      var w = hw * (1 - Math.pow(1 - u, p));
      right.push((cx + w).toFixed(1) + ' ' + y.toFixed(1));
      left.unshift((cx - w).toFixed(1) + ' ' + y.toFixed(1));
    }
    var d = 'M ' + right.join(' L ') + ' L ' + (W - m) + ' ' + (H - m) + ' L ' + m + ' ' + (H - m) + ' L ' + left.join(' L ') + ' Z';
    hullPath.setAttribute('d', d);
  }
  window.addEventListener('resize', drawHull);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(drawHull); }

  // ---- Photos: compressed to JPEG and kept in IndexedDB, one list per antenna ----
  var photos = {};
  var db = null;
  var lbId = null, lbIndex = 0, delArmed = false, delTimer;

  function openDB(done) {
    try {
      var req = indexedDB.open('antenna-check-photos', 1);
      req.onupgradeneeded = function () { req.result.createObjectStore('photos'); };
      req.onsuccess = function () { db = req.result; done(); };
      req.onerror = function () { done(); };
    } catch (e) { done(); }
  }
  function loadPhotos(done) {
    if (!db) { done(); return; }
    try {
      var cur = db.transaction('photos', 'readonly').objectStore('photos').openCursor();
      cur.onsuccess = function () {
        var c = cur.result;
        if (c) { photos[c.key] = c.value; c.continue(); } else { done(); }
      };
      cur.onerror = function () { done(); };
    } catch (e) { done(); }
  }
  function savePhotos(id) {
    if (!db) return;
    try { db.transaction('photos', 'readwrite').objectStore('photos').put(photos[id] || [], id); } catch (e) {}
  }
  function deletePhotoRecord(id) {
    if (!db) return;
    try { db.transaction('photos', 'readwrite').objectStore('photos').delete(id); } catch (e) {}
  }
  function clearAllPhotos() {
    photos = {};
    if (!db) return;
    try { db.transaction('photos', 'readwrite').objectStore('photos').clear(); } catch (e) {}
  }

  function compress(file, done) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 1600, w = img.naturalWidth, h = img.naturalHeight;
      var k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      done(c.toDataURL('image/jpeg', 0.78));
    };
    img.onerror = function () { URL.revokeObjectURL(url); done(null); };
    img.src = url;
  }

  var thumbsEl = document.getElementById('thumbs');
  var photoInput = document.getElementById('photoInput');

  function renderThumbs() {
    thumbsEl.innerHTML = '';

  document.getElementById('addPhoto').addEventListener('click', function () { photoInput.click(); });
  photoInput.addEventListener('change', function () {
    var id = selected;

    photoInput.value = '';
    if (!id || !files.length) return;
    var i = 0;
    (function next() {
      if (i >= files.length) return;
      compress(files[i++], function (data) {
        if (data) {
          photos[id] = (photos[id] || []).concat([data]);
          state[id].ts = Date.now();
          savePhotos(id); save();
          if (selected === id) { renderThumbs(); renderMeta(); }
          renderGrid(); renderStamp();

  var lb = document.getElementById('lightbox');

  var lbImg = document.getElementById('lbImg');
  var lbCount = document.getElementById('lbCount');
  var lbDelete = document.getElementById('lbDelete');

  function lbRender() {
    var list = photos[lbId] || [];
    if (!list.length) { closeLightbox(); return; }
    if (lbIndex >= list.length) lbIndex = list.length - 1;
    lbImg.src = list[lbIndex];
    lbStage.classList.remove('zoomed');
    lbStage.scrollLeft = 0; lbStage.scrollTop = 0;
    lbCount.textContent = state[lbId].label + ' · ' + (lbIndex + 1) + ' / ' + list.length;
    document.getElementById('lbPrev').hidden = list.length < 2;
    document.getElementById('lbNext').hidden = list.length < 2;
    delArmed = false;
    lbDelete.textContent = 'Delete';
  }
  function openLightbox(id, i) { lbId = id; lbIndex = i; lb.hidden = false; lbRender(); }
  function closeLightbox() { lb.hidden = true; lbId = null; lbImg.removeAttribute('src'); }
  function lbStep(d) {
    var n = (photos[lbId] || []).length;
    if (n < 2) return;
    lbIndex = (lbIndex + d + n) % n;

  lbImg.addEventListener('click', function (e) {
    var r = lbImg.getBoundingClientRect();
    var fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    var zoomed = lbStage.classList.toggle('zoomed');
    if (zoomed) {
      lbStage.scrollLeft = fx * lbImg.offsetWidth - lbStage.clientWidth / 2;
      lbStage.scrollTop = fy * lbImg.offsetHeight - lbStage.clientHeight / 2;
    } else {
      lbStage.scrollLeft = 0; lbStage.scrollTop = 0;
    }
  });
  document.getElementById('lbPrev').addEventListener('click', function () { lbStep(-1); });
  document.getElementById('lbNext').addEventListener('click', function () { lbStep(1); });
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  lbDelete.addEventListener('click', function () {
    if (!delArmed) {

      lbDelete.textContent = 'Tap again to delete';
      clearTimeout(delTimer);
      delTimer = setTimeout(function () { delArmed = false; lbDelete.textContent = 'Delete'; }, 3000);
      return;
    }
    clearTimeout(delTimer);
    var id = lbId;
    photos[id].splice(lbIndex, 1);
    savePhotos(id);
    state[id].ts = Date.now();
    save();
    if (selected === id) { renderThumbs(); renderMeta(); }
    renderGrid(); renderStamp();
    lbRender();

  document.addEventListener('keydown', function (e) {

  function purgeAntenna(id) {

  function nextNumber(prefix) {
    var max = 0;
    var re = new RegExp('^' + prefix + '-(\\d+)$');
    DEFAULTS.forEach(function (d) {
      var lab = state[d.id] ? state[d.id].label : d.label;
      var m = re.exec(lab);
      if (m) max = Math.max(max, parseInt(m[1], 10));

  function addAntenna(sec, typeName) {

    sec.items.push({ id: id, label: label, type: info.name });

  // Two-tap confirm, since the page cannot show confirmation dialogs.

    stBody.scrollTop = top;
  }

  function openSettings() { closeSheet(); renderSettings(); settingsEl.hidden = false; stBody.scrollTop = 0; }
  function closeSettings() { settingsEl.hidden = true; renderGrid(); }
  document.getElementById('gearBtn').addEventListener('click', openSettings);
  document.getElementById('settingsClose').addEventListener('click', closeSettings);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !settingsEl.hidden) closeSettings();
  });

  // ---- PDF report: builds a printable report, then opens the print dialog (choose "Save as PDF") ----
  var STATUS_COLORS = { none: '#6b7885', ok: '#17794a', issue: '#a96a0a', down: '#bf3326' };
  function zoneOf(i) { return DEFAULTS[i]; }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function buildReport(now) {
    var r = document.getElementById('report');
    r.innerHTML = '';

    var head = el('div', 'r-head');
    head.appendChild(el('h1', '', 'Antenna Check Report'));
    head.appendChild(el('p', 'r-date', now.toLocaleString([], { dateStyle: 'full', timeStyle: 'short' })));
    r.appendChild(head);

    var sum = el('div', 'r-summary');
    STATUSES.forEach(function (s) {
      var n = DEFAULTS.filter(function (d) { return state[d.id].status === s.id; }).length;
      var box = el('div', 'r-count');
      var b = el('b', '', String(n));
      b.style.color = STATUS_COLORS[s.id];
      box.appendChild(b);
      box.appendChild(el('span', '', s.label));
      sum.appendChild(box);
    });
    r.appendChild(sum);

    var plan = el('div', 'r-plan');
    DEFAULTS.forEach(function (d, i) {
      if (d.first) {
        var sec = el('div', 'r-sec');
        sec.appendChild(el('span', 'r-zone', zoneOf(i).zone));
        sec.appendChild(el('span', 'r-area', zoneOf(i).area));
        plan.appendChild(sec);
      }
      var c = STATUS_COLORS[state[d.id].status];
      var t = el('div', 'r-tile' + (d.round ? ' round' : ''));
      t.style.borderColor = c;
      t.appendChild(el('b', '', state[d.id].label));
      var st = el('span', '', statusOf(d.id).label);
      st.style.color = c;
      t.appendChild(st);
      plan.appendChild(t);
    });
    r.appendChild(plan);

    var table = el('table', 'r-table');
    var thead = el('thead');
    var hr = el('tr');
    ['Antenna', 'Type', 'Location', 'Status', 'Updated', 'Note', 'Photos'].forEach(function (h) { hr.appendChild(el('th', '', h)); });
    thead.appendChild(hr);
    table.appendChild(thead);
    var tbody = el('tbody');
    DEFAULTS.forEach(function (d, i) {
      var s = state[d.id];
      var tr = el('tr');
      tr.appendChild(el('td', 'r-strong', s.label));
      tr.appendChild(el('td', '', d.type));
      tr.appendChild(el('td', '', zoneOf(i).zone + ' · ' + zoneOf(i).area));
      var stTd = el('td', 'r-strong', statusOf(d.id).label);
      stTd.style.color = STATUS_COLORS[s.status];
      tr.appendChild(stTd);
      tr.appendChild(el('td', '', s.ts ? fmt(s.ts) : '-'));
      tr.appendChild(el('td', 'r-note', s.note || '-'));
      tr.appendChild(el('td', '', String((photos[d.id] || []).length)));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    r.appendChild(table);

    var any = DEFAULTS.some(function (d) { return (photos[d.id] || []).length; });
    if (any) {
      var ph = el('div', 'r-photos');
      ph.appendChild(el('h2', '', 'Photos'));
      DEFAULTS.forEach(function (d, i) {
        var list = photos[d.id] || [];
        if (!list.length) return;
        var blk = el('section', 'r-block');
        blk.appendChild(el('h3', '', state[d.id].label + ' · ' + d.type + ' · ' + zoneOf(i).zone + ' ' + zoneOf(i).area));
        blk.appendChild(el('p', 'r-meta', statusOf(d.id).label + (state[d.id].note ? ' - ' + state[d.id].note : '')));
        var g = el('div', 'r-grid');
        list.forEach(function (src, k) {
          var f = el('figure');
          var im = document.createElement('img');
          im.src = src; im.alt = '';
          f.appendChild(im);
          f.appendChild(el('figcaption', '', 'Photo ' + (k + 1) + ' of ' + list.length));
          g.appendChild(f);
        });
        blk.appendChild(g);
        ph.appendChild(blk);
      });
      r.appendChild(ph);
    }
  }

  function printReport() {
    var now = new Date();
    buildReport(now);
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    var prevTitle = document.title;
    document.title = 'Antenna Check Report ' + now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + pad(now.getMinutes());
    var imgs = Array.prototype.slice.call(document.querySelectorAll('#report img'));
    Promise.all(imgs.map(function (im) {
      return im.decode ? im.decode().catch(function () {}) : Promise.resolve();
    })).then(function () {
      window.onafterprint = function () { document.title = prevTitle; window.onafterprint = null; };
      window.print();
    });
  }
  document.getElementById('pdf').addEventListener('click', printReport);

  var resetBtn = document.getElementById('reset');
  var armed = false, armTimer;
  resetBtn.addEventListener('click', function () {
    if (!armed) {
      armed = true; resetBtn.textContent = 'Tap again to clear all';
      armTimer = setTimeout(function () { armed = false; resetBtn.textContent = 'Reset all'; }, 3000);
      return;
    }
    clearTimeout(armTimer); armed = false; resetBtn.textContent = 'Reset all';
    state = blank(); save(); clearAllPhotos(); closeSheet(); renderStamp(); showToast('All antennas cleared');
  });

  function renderStamp() {
    var latest = 0;
    DEFAULTS.forEach(function (d) { if (state[d.id].ts && state[d.id].ts > latest) latest = state[d.id].ts; });
    document.getElementById('stamp').textContent = latest ? 'Last change ' + fmt(latest) : 'No checks recorded yet';
  }

  loadLayout(); rebuild(); load(); renderGrid(); renderStamp();
  openDB(function () {
    if (!db) { document.getElementById('photoHint').hidden = false; }
    loadPhotos(function () { renderGrid(); if (selected) renderThumbs(); });
  });
})();
</script>
</body>
</html>
